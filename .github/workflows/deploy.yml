name: deploy

# publica a folha no github pages.
#
# só roda no push da branch principal e no acionamento manual. sem
# `pull_request_target`, sem `workflow_run`: nada aqui executa código vindo de
# fork, então não existe caminho de fork para o token do Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# permissão mínima, declarada explicitamente. sem este bloco o token herda o
# padrão do repositório, que costuma ser mais largo do que este job precisa.
permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez. se dois pushes chegarem juntos, o segundo espera em vez
# de correr contra o primeiro; e não cancelamos o que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build

      # o site inteiro promete que todo link foi conferido. essa promessa
      # precisa de um guarda no ci, senão ela vale só no dia em que foi feita.
      - name: conferir links externos
        run: node scripts/check-links.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
